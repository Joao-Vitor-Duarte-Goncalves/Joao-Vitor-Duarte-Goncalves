<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#05071A"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="45%" stop-color="#2F7BFF"/>
      <stop offset="75%" stop-color="#5B3DF5"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F7BFF"/>
      <stop offset="50%" stop-color="#5B3DF5"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F7BFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2F7BFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5B3DF5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2F7BFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-150 0;150 0;-150 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F7BFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#5B3DF5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2F7BFF" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="1180" height="380" rx="22" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="380" rx="22" fill="url(#grid)"/>

  <!-- header -->
  <text x="50" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B7280">~/joao-vitor $ cat core.json</text>
  <text x="50" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="url(#title)">JOÃO VITOR // CORE</text>
  <path d="M50 128 H1150" stroke="url(#flow)" stroke-width="2"/>

  <!-- left column -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="50" y="175" fill="#2F7BFF">role</text>
    <text x="190" y="175" fill="#F5F7FF">Desenvolvedor Full Stack · Estagiário @ Inforgeneses</text>

    <text x="50" y="215" fill="#2F7BFF">stack</text>
    <text x="190" y="215" fill="#F5F7FF">Laravel · PHP · MySQL · JavaScript · Docker</text>

    <text x="50" y="255" fill="#2F7BFF">building</text>
    <text x="190" y="255" fill="#F5F7FF">SaaS próprio · sistemas internos · jogos web</text>

    <text x="50" y="295" fill="#2F7BFF">teaching</text>
    <text x="190" y="295" fill="#F5F7FF">Python · hardware de PC · tecnologia básica</text>

    <text x="50" y="335" fill="#2F7BFF">location</text>
    <text x="190" y="335" fill="#F5F7FF">Teresina, PI · Brasil</text>
  </g>

  <!-- right: pulsing core -->
  <g transform="translate(1000 250)">
    <circle r="120" fill="url(#glow)"/>
    <circle r="70" fill="none" stroke="#2F7BFF" stroke-opacity="0.35" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#5B3DF5" stroke-opacity="0.55" stroke-dasharray="18 10">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#080B1C" stroke="#2F7BFF" stroke-width="2" filter="url(#soft)">
      <animate attributeName="r" values="20;24;20" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#F5F7FF">JV</text>
    <circle cx="70" cy="0" r="4" fill="#2F7BFF">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-48" cy="0" r="3.5" fill="#7B2FF7">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status -->
  <g transform="translate(1150 62)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="end">
    <circle cx="-130" cy="-5" r="5" fill="#2F7BFF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text fill="#8FB4FF">status: online</text>
  </g>
</svg>

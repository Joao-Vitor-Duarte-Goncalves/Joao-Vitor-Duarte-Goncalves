<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-150 0;150 0;-150 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="1180" height="380" rx="22" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="380" rx="22" fill="url(#grid)"/>

  <!-- header -->
  <text x="50" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b">~/joao-vitor $ cat core.json</text>
  <text x="50" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="url(#title)">JOÃO VITOR // CORE</text>
  <path d="M50 128 H1150" stroke="url(#flow)" stroke-width="2"/>

  <!-- left column -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="50" y="175" fill="#22d3ee">role</text>
    <text x="190" y="175" fill="#e2e8f0">Desenvolvedor Full Stack · Estagiário @ Inforgeneses</text>

    <text x="50" y="215" fill="#22d3ee">stack</text>
    <text x="190" y="215" fill="#e2e8f0">Laravel · PHP · MySQL · JavaScript · Docker</text>

    <text x="50" y="255" fill="#22d3ee">building</text>
    <text x="190" y="255" fill="#e2e8f0">SaaS próprio · sistemas internos · jogos web</text>

    <text x="50" y="295" fill="#22d3ee">teaching</text>
    <text x="190" y="295" fill="#e2e8f0">Python · hardware de PC · tecnologia básica</text>

    <text x="50" y="335" fill="#22d3ee">location</text>
    <text x="190" y="335" fill="#e2e8f0">Teresina, PI · Brasil</text>
  </g>

  <!-- right: pulsing core -->
  <g transform="translate(1000 250)">
    <circle r="120" fill="url(#glow)"/>
    <circle r="70" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#8b5cf6" stroke-opacity="0.55" stroke-dasharray="18 10">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#soft)">
      <animate attributeName="r" values="20;24;20" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e2e8f0">JV</text>
    <circle cx="70" cy="0" r="4" fill="#22d3ee">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-48" cy="0" r="3.5" fill="#ec4899">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status -->
  <g transform="translate(1150 62)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="end">
    <circle cx="-130" cy="-5" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text fill="#86efac">status: online</text>
  </g>
</svg>
